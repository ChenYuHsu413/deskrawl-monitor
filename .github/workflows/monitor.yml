name: Monitor Steam Build

on:
  schedule:
    # 所有 cron 皆為 UTC；台灣時間 = UTC+8
    # 每天 06:32、06:42、06:52（台灣）= 前一天 22:32/42/52 UTC
    - cron: "32,42,52 22 * * *"
    # 每天 07:07–07:52（台灣）= 前一天 23:07–23:52 UTC
    - cron: "7,22,37,52 23 * * *"
    # 每天 08:07–15:52（台灣）= 00:07–07:52 UTC
    - cron: "7,22,37,52 0-7 * * *"
    # 每天 17:37、17:52（台灣）= 09:37、09:52 UTC
    - cron: "37,52 9 * * *"
    # 每天 18:07–18:52（台灣）= 10:07–10:52 UTC
    - cron: "7,22,37,52 10 * * *"
  workflow_dispatch:
    inputs:
      preview_announce:
        description: "預覽官方公告翻譯（翻譯最新 2 則並發送，不更新 state.json）"
        type: boolean
        default: false
      preview_text:
        description: "預覽翻譯指定文字（有填就只翻這段並發送，不讀頻道、不更新 state.json）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check build ID
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash .github/scripts/check.sh
      # 與 Build ID 監控互相獨立：上一步失敗仍會執行
      - name: Forward announcements
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANNOUNCE_CHANNEL_ID: ${{ secrets.ANNOUNCE_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PREVIEW: ${{ inputs.preview_announce == true }}
          PREVIEW_TEXT: ${{ inputs.preview_text }}
        run: bash .github/scripts/announce.sh
